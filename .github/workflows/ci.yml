name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage
      - run: npm run build
      - name: Check bundle size
        run: |
          limit=266240 # 260 KB
          size=$(wc -c < main.js)
          echo "main.js: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::main.js exceeds $limit bytes"
            exit 1
          fi
